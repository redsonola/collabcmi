version: 1
frontend:
  phases:
    preBuild:
      commands:
        # vite 7 needs node >= 20.19
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
